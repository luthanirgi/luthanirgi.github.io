site_name: mi_core
site_description: Documentation for mi_core and the mi resources, a FiveM ecosystem by Mamang Irgi.
site_url: https://luthanirgi.github.io/
docs_dir: docs

# The header GitHub link points at the profile, not one repo.
repo_url: https://github.com/luthanirgi
repo_name: luthanirgi
edit_uri: ""

# SUMMARY.md is GitBook's navigation file. MkDocs uses the nav below instead, so it is skipped from
# the MkDocs build (the file stays for GitBook Git Sync).
exclude_docs: |
  SUMMARY.md

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    scheme: slate      # dark base; the exact winter_blue hexes come from stylesheets/extra.css
    primary: black
    accent: blue
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

# Mounts the playable demo iframes on the two minigame pages. Their builds sit in docs/demos/ and are
# refreshed from the resources by tools/sync-demos.ps1.
extra_javascript:
  - javascripts/demo.js

# Footer icons: GitHub profile, the Tebex store, and PayPal donations.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/luthanirgi
      name: GitHub
    - icon: fontawesome/solid/cart-shopping
      link: https://luthanirgi.tebex.io/
      name: Tebex store
    - icon: fontawesome/brands/paypal
      link: https://paypal.me/luthanirgi
      name: Donate on PayPal

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: README.md
  - mi_core:
      - Overview: mi_core/README.md
      - Getting started:
          - Getting started: mi_core/getting-started/README.md
          - Installation: mi_core/getting-started/installation.md
          - Configuration: mi_core/getting-started/configuration.md
          - Migrating from qbx or qb: mi_core/getting-started/migrating.md
      - Guides:
          - Guides: mi_core/guides/README.md
          - Your first resource: mi_core/guides/first-resource.md
          - Players and money: mi_core/guides/players-and-money.md
          - Jobs and gangs: mi_core/guides/jobs-and-gangs.md
